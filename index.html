<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnTap Ads App</title>
    <!-- مكتبة AdsGram الرسمية -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            text-align: center;
            background-color: #18191a;
            color: #ffffff;
            margin-top: 80px;
        }
        .container {
            padding: 20px;
        }
        button {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>تطبيق الأرباح - EarnTap</h1>
        <p>شاهد الإعلان واحصل على مكافأتك الفورية</p>
        
        <button onclick="showRewardedAd()">شاهد الإعلان واربح</button>
    </div>

    <script>
        // تهيئة وحدة الإعلانات بالمعرّف الصحيح 46651
        const adController = window.Adsgram.init({ blockId: "46651" });

        function showRewardedAd() {
            adController.show()
                .then((result) => {
                    // نجاح مشاهدة الإعلان بالكامل
                    alert("تهانينا! تم إكمال الإعلان بنجاح وتم منح المكافأة.");
                })
                .catch((err) => {
                    // إغلاق الإعلان قبل اكتماله أو حدوث خطأ
                    alert("لم يتم إكمال مشاهدة الإعلان.");
                });
        }
    </script>
</body>
</html>
