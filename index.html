<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOM Hatchery</title>
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #1a1a1a);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .container {
            background: var(--tg-theme-secondary-bg-color, #2a2a2a);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #0088cc;
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled {
            background-color: #555555;
            cursor: not-allowed;
        }
        #status {
            margin-top: 18px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🐣 TOM Hatchery</h1>
        <p>شاهد الإعلان للحصول على المكافأة الفورية!</p>
        
        <button class="btn" id="adBtn" onclick="showRewardAd()">📺 مشاهدة الإعلان</button>
        
        <div id="status"></div>
    </div>

    <script>
        // تهيئة تطبيق تليجرام المصغر
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // تهيئة إعلانات Adsgram باستخدام الـ Block ID الجديد
        const AdController = window.Adsgram.init({ 
            blockId: "46819" 
        });

        function showRewardAd() {
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('adBtn');
            
            statusDiv.innerText = "جاري تحميل الإعلان...";
            statusDiv.style.color = "#e67e22";
            btn.disabled = true;

            AdController.show().then((result) => {
                // تمت مشاهدة الإعلان بنجاح
                statusDiv.innerText = "🎉 تم مشاهدة الإعلان بنجاح! تم إضافة المكافأة.";
                statusDiv.style.color = "#2ecc71";
                btn.disabled = false;
            }).catch((result) => {
                // حدث خطأ أو تعذر مشاهدة الإعلان
                console.error("Ad Error / Skipped:", result);
                statusDiv.innerText = "❌ لم تكتمل مشاهدة الإعلان أو لا يتوفر إعلان حالياً.";
                statusDiv.style.color = "#e74c3c";
                btn.disabled = false;
            });
        }
    </script>

</body>
</html>
