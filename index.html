<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnTapAds App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1c2733; color: white; padding: 20px; }
        button { background: #2481cc; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 10px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>مرحباً بك في التطبيق</h1>
    <p>اضغط للربح ومشاهدة الإعلانات</p>
    <button onclick="showAd()">مشاهدة إعلان</button>

    <script>
        const Telegram = window.Telegram.WebApp;
        Telegram.ready();
        Telegram.expand();

        function showAd() {
            alert("التطبيق يعمل بنجاح!");
        }
    </script>
</body>
</html>
